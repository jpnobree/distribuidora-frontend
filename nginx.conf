server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que nao seja um arquivo real cai no index.html,
    # pro React Router (BrowserRouter) resolver no cliente. Sem isso,
    # recarregar a pagina em /catalogo ou /login daria 404 no nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos gerados pelo Vite em /assets tem hash no nome (ex:
    # index-C6A1TRhH.js) - um novo deploy gera nomes novos, entao e seguro
    # cachear esses arquivos "para sempre" no navegador.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html precisa ser sempre revalidado - e ele que aponta pros
    # nomes com hash do build atual.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
